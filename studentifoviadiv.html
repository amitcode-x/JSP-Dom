<!DOCTYPE html>
<html lang="en">

<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <title>Student Info</title>
    <style>
        .bg-info {
            background: linear-gradient(45deg, rgb(15, 14, 14), cyan);
        }

        .tr {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40%;

        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark bg-info p-4">
        <a href="" class="navbar-brand">Student portal</a>
    </nav>

    <div class="row mt-4 w-75 m-auto">
        <div class="col-3 "> <button id="all-btn" class=" btn bg-info text-white">All Students</button></div>
        <div class="col-3"> <button id="male-btn" class="btn bg-info text-white ">Male Students</button></div>
        <div class="col-3"> <button id="female-btn" class="btn bg-info text-white">Female Students</button></div>
        <div class="col-3"><input id="searchBox" type="search" class="form-control" placeholder="Search Here"></div>

    </div>

    <div class="mt-5">
        <!-- 
        <table class="table w-75 m-auto text-center ">
            <thead>
                <tr>
                    <th>id</th>
                    <th>Name</th>
                    <th>Gender</th>
                </tr>
            </thead>
            <tbody id="data">
                <tr>
                    <td>${ele.id}</td>
                    <td>${ele.name}</td>
                    <td>${ele.Gender}</td>
                </tr>`



            </tbody>
        </table> -->

        <div id="main" class="">

            <div class="tr">
                <div class="th">id</div>
                <div class="th">name</div>
                <div class="th">Gender</div>
            </div>

            <div class="data">
                
            </div>

        </div>
    </div>



    <script>

        let students = [
            { id: 101, name: 'Amit', Gender: 'male' },
            { id: 101, name: 'sumit', Gender: 'male' },
            { id: 101, name: 'saurabh', Gender: 'male' },
            { id: 101, name: 'Anushka', Gender: 'female' },
            { id: 101, name: 'Srishti', Gender: 'female' },
            { id: 101, name: 'Annu', Gender: 'female' }
        ]

        let display_data = document.getElementById('data')
        let allstudents = document.getElementById('all-btn')
        let malestudents = document.getElementById('male-btn')
        let femalestudents = document.getElementById('female-btn')

        function display(arr) {
            let res = ``;
            arr.forEach((ele) => {
                res += `<div class="tr">
                    <div class="td">${ele.id}</div>
                    <div class="td">${ele.name}</div>
                    <div class="td">${ele.Gender}</div>
                </div>`
                // console.log(res)
            }
            )
            display_data.innerHTML = res;
        }
        // display(students)

        // for male students --------------------------------------------

        function displayMale(arr) {
            let males = arr.filter((ele) => {
                return ele.Gender == 'male'

            }
            )
            display(males);
            console.log(males)

        }
        // displayMale(students)


        // for female students ----------------------------------------------------


        function displayfeMale(arr) {
            let females = arr.filter((ele) => {
                return ele.Gender == 'female'

            }
            )
            display(females);
            console.log(females)
 
        }
        displayfeMale(students)
         
         
        function filterBySearch(keyword) {
            let filtered = students.filter(ele => ele.name.toLowerCase().includes(keyword.toLowerCase()));
            display(filtered);
        }

        searchBox.addEventListener('input', (ele) => filterBySearch(ele.target.value));
        
 
   

 
        allstudents.addEventListener('click', () => {
            display(students)
            console.log('clicked')

        })

        malestudents.addEventListener('click', () => {
            displayMale(students)
            console.log('clicked')

        })

        femalestudents.addEventListener('click', () => {
            displayfeMale(students)
            console.log('clicked')

        })









    </script> 

</body>

</html>
