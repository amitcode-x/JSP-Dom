<!DOCTYPE html>
<html lang="en">

<head>

    <title>Log In</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        nav {
            background: linear-gradient(45deg, rgb(15, 14, 14), cyan);


        }

        .btn {

            padding: 5px 10px;
            color: white;
            background: green;

        }

        .card-header {
            background: linear-gradient(45deg, rgb(15, 14, 14), cyan);
            color: white;

        }
    </style>
</head>

<body>
    <nav class="navbar p-3 bg-danger">

        <h1 class=" text-white">Welcome</h1>
        <button id="nav-btn" class="btn fs-4 bg-warning">LogIn</button>

    </nav>

    <div id="cardd" class="card m-auto w-50 my-5 visually-hidden">
        <div class="card-header ">
            <div class="row p-2">
                <div class="col-11">LoginPage</div>
                <div id="close-btn" class="col-1">❌</div>
            </div>
        </div>
        <div class="card-body">
            <form action="">
                <input type="text" class="form-control" placeholder="Enter the UserName">
                <div class="input-group my-2">



                    <input id="pw" type="password" class="form-control" placeholder="Enter the password">
                    <span class="input-group-text"><i id="open-eye" class="bi-eye-fill"></i></span>
                </div>
                <input type="submit" class="btn">
            </form>
        </div>
    </div>

    <script>
        let navb = document.getElementById('nav-btn')
        let cardd = document.getElementById('cardd')
        let closeb = document.getElementById('close-btn')
        let opene = document.getElementById('open-eye')
        let pass = document.getElementById('pw')
        navb.addEventListener('click', function () {
            cardd.classList.remove('visually-hidden')
        })
        closeb.addEventListener('click', function () {
            cardd.classList.add('visually-hidden')
        })

        opene.addEventListener('click', function () {
            if (opene.classList.contains("bi-eye-fill")) {
                opene.classList.remove('bi-eye-fill')
                opene.classList.add('bi-eye-slash-fill')
                pass.type = ('password')

            }
            else {

                opene.classList.remove('bi-eye-slash-fill');
                opene.classList.add('bi-eye-fill');
                pass.type = ('text')
            }
        })




    </script>



</body>

</html>
